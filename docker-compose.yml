services:
  relaygrid:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./relaygrid.db
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - relaygrid-data:/app
volumes:
  relaygrid-data:
